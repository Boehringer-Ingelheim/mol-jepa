seed: 42
trainer:
  _target_: lightning.Trainer
  max_epochs: 1000
  accelerator: gpu
  devices: 1
  precision: 32
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0
  enable_checkpointing: false
  logger:
    _target_: lightning.pytorch.loggers.TensorBoardLogger
    name: mol-jepa
    save_dir: ./logs/

module:
  optimizer:
    lr: 0.001
    weight_decay: 0.001
  modalities: ${data.modalities}
  labels: ${data.labels}
  label_strategy: ${data.label_strategy}
  moe_encoder:
    hidden_dim: 32
    masking_strategy: ratio_first_pass
    masking_ratio: 0.3
    lambda: 0.1
    use_prediction_head: false
    use_loss_projection: false
    weighted_loss: true
    weights: ${data.weights}
    pooling_strategy: mean
    dropout: 0.1
  expert_encoders:
    graph_encoder:
      layers: 1
      layer_type: TransformerConv
      hidden_dim: ${module.moe_encoder.hidden_dim}
      output_dim: ${module.moe_encoder.hidden_dim}
      activation: gelu
      dropout: ${module.moe_encoder.dropout}
      attn_heads: 2
      pooling: mean
    emb_encoder:
      layers: 1
      hidden_dim: ${module.moe_encoder.hidden_dim}
      output_dim: ${module.moe_encoder.hidden_dim}
      activation: gelu
      dropout: ${module.moe_encoder.dropout}
    atom_encoder:
      layers: 2
      hidden_dim: ${module.moe_encoder.hidden_dim}
      output_dim: ${module.moe_encoder.hidden_dim}
      attn_heads: 2
      dropout: ${module.moe_encoder.dropout}
  probes:
    input_dim: ${module.moe_encoder.hidden_dim}
    hidden_dim: 128
    output_dim: 1
data:
  filename: merged_data_deduplicated_with_benchmarks_n=56k.csv
  num_workers: 128
  batch_size: 32
  drop_last: true
  shuffle: false
  recreate: false
  metadata_cols:
    - smiles
    - dataset
    - chembl_id
    - provided_split
  weights:
    - name: chembl_targets
      weight: 188.5
    - name: tdc_targets
      weight: 182.81
    - name: pcba_targets
      weight: 152.01
    - name: nabla_targets
      weight: 145.79
    - name: moe
      weight: 1.05
    - name: boltz
      weight: 198.72
    - name: uma
      weight: 150.69
    - name: chemgpt
      weight: 1.0
    - name: graph
      weight: 1.0
  modalities:
  - name: chemgpt
    input: smiles
    output: embedding
    dim: 2048
    processing: batch
    batch_size: 128
  - name: graph
    input: smiles
    output: graph
    node_dim: 82
    edge_dim: 17
    processing: multiprocess
  # - name: uma
  #   input: ase
  #   output: atoms
  #   node_dim: 128
  #   processing: batch
  #   batch_size: 64
  - name: uma
    input: precomputed_node
    output: atoms
    colname: uma_embedding_path
    node_dim: 128
    processing: multiprocess
  - name: boltz
    input: precomputed
    output: embedding
    colname: boltz_embedding_path
    dim: 6912
    processing: multiprocess
  - name: moe
    input: precomputed
    output: embedding
    colname: moe_descriptors_path
    dim: 227
    processing: multiprocess
  labels:
  - name: chembl_targets
    colname: chembl_targets_path
    dim: 296
  - name: tdc_targets
    colname: tdc_targets_path
    dim: 672
  - name: pcba_targets
    colname: pcba_targets_path
    dim: 1328
  - name: nabla_targets
    colname: nabla_targets_path
    dim: 17
  label_strategy: modality # modality, label
  benchmark_labels:
    asap_potency: 
      type: regression
      labels:
      - pIC50 (MERS-CoV Mpro) 
      - pIC50 (SARS-CoV-2 Mpro)
    asap_admet:
      type: regression
      labels:
      - log_HLM 
      - log_KSOL
      - LogD 
      - log_MDR1-MDCKII 
      - log_MLM 
    biogen_adme:
      type: regression
      labels:
      - hlm_clint
      - mdr1_mdck_er
      - plasma_protein_binding_human
      - plasma_protein_binding_rat
      - rlm_clint
      - solubility_ph_6_8
    # tox21_linz:
    #   type: classification
    #   labels:
    #   - NR-AR
    #   - NR-AR-LBD
    #   - NR-AhR
    #   - NR-Aromatase
    #   - NR-ER
    #   - NR-ER-LBD
    #   - NR-PPAR-gamma
    #   - SR-ARE
    #   - SR-ATAD5
    #   - SR-HSE
    #   - SR-MMP
    #   - SR-p53
    expansionrx:
      type: regression
      labels:
      - log_Caco-2 Permeability Efflux
      - log_Caco-2 Permeability Papp A
      - log_HLM CLint
      - log_KSOL
      - LogD
      - log_MBPB
      - log_MGMB
      - log_MLM CLint
      - log_MPPB
hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false