defaults:
  - _self_
  - moljepa
  - override hydra/launcher: submitit_slurm
  - override hydra/sweeper: optuna

hydra:
  mode: MULTIRUN
  sweeper:
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    direction: minimize
    n_trials: 100
    n_jobs: 10
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: 42
      n_startup_trials: 10
      multivariate: True
      consider_prior: True
    params:
      module.optimizer.lr: choice(0.01, 0.005, 0.001, 0.0005)
      module.optimizer.weight_decay: choice(0.0, 0.0001, 0.001, 0.01)
      module.moe_encoder.hidden_dim: choice(32, 128, 1024)
      module.moe_encoder.masking_ratio: choice(0.1, 0.3, 0.6, 0.9)
      module.moe_encoder.lambda: choice(0.1, 0.3, 0.5, 0.7)
      module.moe_encoder.dropout: choice(0.1, 0.4, 0.7)
      module.moe_encoder.use_prediction_head: choice(true, false)
      module.moe_encoder.use_loss_projection: choice(true, false)
      module.moe_encoder.pooling_strategy: choice("mean", "softmax_attention")
      module.expert_encoders.graph_encoder.layers: choice(1, 2, 3)
      module.expert_encoders.graph_encoder.attn_heads: choice(2, 4, 8)
      module.expert_encoders.emb_encoder.layers: choice(1, 2, 3)
      module.expert_encoders.atom_encoder.layers: choice(1, 2, 3)
      module.expert_encoders.atom_encoder.attn_heads: choice(2, 4, 8)
      data.batch_size: choice(32, 64, 128)
      data.label_strategy: choice("none", "modality")
  sweep:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

  launcher:
    partition: gpu
    timeout_min: 43200
    cpus_per_task: 8
    mem_gb: 64
    gpus_per_node: 1

trainer:
  max_epochs: 100
  logger:
    version: hp14_${hydra:job.num}

data:
  filename: merged_data_deduplicated_with_benchmarks_n=14k.csv